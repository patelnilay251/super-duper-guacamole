<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ditherwall — live</title>
<meta name="color-scheme" content="dark">
<meta name="description" content="A living wall of photographs, each rendered through a different dithering or shader algorithm.">
<!-- Inline Bayer-pattern icon: avoids a favicon round trip (and its 404). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230b0b0e'/%3E%3Cg fill='%23d8ff4f'%3E%3Crect x='0' y='0' width='2' height='2'/%3E%3Crect x='4' y='0' width='2' height='2'/%3E%3Crect x='2' y='2' width='2' height='2'/%3E%3Crect x='6' y='2' width='2' height='2'/%3E%3Crect x='0' y='4' width='2' height='2'/%3E%3Crect x='4' y='4' width='2' height='2'/%3E%3Crect x='2' y='6' width='2' height='2'/%3E%3Crect x='6' y='6' width='2' height='2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <h1>ditherwall</h1>
    <p id="status">warming up…</p>
  </div>

  <div class="controls">
    <div class="chips" id="genres" role="group" aria-label="Style"></div>
    <div class="buttons">
      <button id="size" type="button" title="Tile size" aria-label="Cycle tile size">◧ <span id="sizeLabel">medium</span></button>
      <button id="shuffle" type="button" title="Replace every tile">↻ shuffle</button>
      <button id="pause" type="button" aria-pressed="false" title="Pause automatic refresh">⏸ pause</button>
    </div>
  </div>
</header>

<main id="grid" class="grid" aria-label="Rendered tiles"></main>

<footer class="foot">
  <span>photographs from Unsplash via Picsum · every effect computed server-side in NumPy</span>
</footer>

<script src="/app.js" type="module"></script>
</body>
</html>
