<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ditherwall — differential harness</title>
<style>body{background:#111;color:#eee;font:13px ui-monospace,monospace;margin:0;padding:1rem}</style>
</head>
<body>
<p id="state">idle</p>
<canvas id="c" width="256" height="256"></canvas>

<script type="module">
// Headless bench: renders a single case at a fixed time with no pointer, and
// hands the pixels back so the Python reference can be compared against them.
// Everything that varies at runtime -- time, seed, pointer -- is pinned, so any
// difference is attributable to the shader itself.

import { VERT, FRAG } from './shaders.js';

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
const programs = {};
const textures = {};
let noiseTex = null;

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}

function build(src) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, src));
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, '');
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}

function texFromImage(img, mip = true) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  if (mip) gl.generateMipmap(gl.TEXTURE_2D);
  return t;
}

async function loadImage(src) {
  const img = new Image();
  img.src = src;
  await img.decode();
  return img;
}

async function boot() {
  for (const [name, src] of Object.entries(FRAG)) programs[name] = build(src);

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const noiseImg = await loadImage('bluenoise.png');
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 64, 64, 0, gl.RED, gl.UNSIGNED_BYTE, noiseImg);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  noiseTex = t;

  document.getElementById('state').textContent = 'ready';
  window.__ready = true;
}

window.renderCase = async function (spec) {
  const { photo, size, program, kind, palette, uniforms, crop, tone, gamma } = spec;

  canvas.width = canvas.height = size;
  if (!textures[photo]) textures[photo] = texFromImage(await loadImage(photo));

  const { p, u } = programs[program];
  gl.viewport(0, 0, size, size);
  gl.useProgram(p);
  gl.disable(gl.BLEND);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, textures[photo]);
  gl.uniform1i(u.uTex, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, noiseTex);
  gl.uniform1i(u.uNoise, 1);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, textures[photo]);   // unused by compared effects
  if (u.uDepthTex) gl.uniform1i(u.uDepthTex, 2);

  gl.uniform4f(u.uCrop, crop[0], crop[1], crop[2], crop[3]);
  gl.uniform2f(u.uRes, size, size);
  gl.uniform1f(u.uTime, 0);          // pinned
  gl.uniform1f(u.uSeed, 0);          // pinned
  gl.uniform2f(u.uPointer, 0, 0);
  gl.uniform1f(u.uPointerAmt, 0);    // interaction disabled
  gl.uniform2f(u.uTone, tone[0], tone[1]);
  if (u.uCropGamma) gl.uniform1f(u.uCropGamma, gamma);
  if (u.uAlpha) gl.uniform1f(u.uAlpha, 1);

  if (u.uPalette && palette) {
    gl.uniform3fv(u.uPalette, palette.flat());
    gl.uniform1i(u.uPaletteLen, palette.length);
  }
  for (const [k, v] of Object.entries(uniforms || {})) {
    const loc = u[k];
    if (!loc) continue;
    if (typeof v === 'number') gl.uniform1f(loc, v);
    else gl.uniform3fv(loc, v.flat ? v.flat() : v);
  }
  if (kind !== undefined && kind !== null && u.uKind) gl.uniform1i(u.uKind, kind);
  if (uniforms && uniforms.uRamp && u.uRampLen) gl.uniform1i(u.uRampLen, uniforms.uRamp.length);

  gl.drawArrays(gl.TRIANGLES, 0, 3);
  return canvas.toDataURL('image/png');
};

boot();
</script>
</body>
</html>
